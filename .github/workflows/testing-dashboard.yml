name: Testing Dashboard

on:
  schedule:
    # 3 AM Vancouver time (UTC-7)
    - cron: "0 10 * * *"

  workflow_dispatch:
    inputs:
      mobile_run_id:
        description: "Optional Mobile workflow run ID. Leave empty to select latest completed run."
        required: false 
        type: string
      previous_run_id:
        description: "Optional previous dashboard workflow run ID. Leave empty to select the latest successful dashboard run."
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  CUSTOM_WORKSPACE: /isolated-build/repo
  REPORT_WORK: /isolated-build/dashboard-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: testing-dashboard-pages
  cancel-in-progress: false

jobs:
  generate-dashboard:
    runs-on: [self-hosted, docker]
    container:
      image: python:3.10.18-bookworm
    timeout-minutes: 20

    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git gh

      - name: Checkout Platform
        uses: bfraser/cicd/actions/checkout@v1
        with:
          path: ${{ env.CUSTOM_WORKSPACE }}

      - name: Prepare isolated report directories
        run: |
          report_work="$REPORT_WORK"
          mkdir -p "$report_work/current/tests"
          mkdir -p "$report_work/current/coverage"
          mkdir -p "$report_work/previous"
          mkdir -p "$report_work/site"
          cp -a testing-dashboard/page/index.html "$report_work/site/"
          cp -a testing-dashboard/page/logos "$report_work/site/"
        working-directory: ${{ env.CUSTOM_WORKSPACE }}

      - name: Download Mobile Artifacts
        env:
          GH_HOST: github.sfu.ca
          GH_ENTERPRISE_TOKEN: ${{ secrets.REPORT_ARTIFACT_TOKEN }}
          MOBILE_RUN_ID: ${{ github.event.inputs.mobile_run_id }}
        # change MOBILE_BRANCH and MOBILE_WORKFLOW if the branch that is reported changes or the workflow that produces test artifacts changes respectively
        run: | 
          set -eu
          MOBILE_BRANCH="main" 
          MOBILE_WORKFLOW="main-cicd.yaml"
          MOBILE_REPO="github.sfu.ca/cradle-project/Cradle-Mobile"

          if [ -z "$MOBILE_RUN_ID" ]; then
            MOBILE_RUN_ID=$(gh run list \
              --repo "$MOBILE_REPO" \
              --workflow "$MOBILE_WORKFLOW" \
              --branch "$MOBILE_BRANCH" \
              --limit 100 \
              --json databaseId,status \
              --jq '[.[] | select(.status == "completed")][0].databaseId // empty')
          fi

          if [ -z "$MOBILE_RUN_ID" ]; then
            echo "Error: No completed Mobile workflow run found."
            exit 1
          fi

          echo "Using mobile run ID: $MOBILE_RUN_ID"

          gh run download "$MOBILE_RUN_ID" \
            --repo "$MOBILE_REPO" \
            --name mobile-unit-test-results \
            --dir "$REPORT_WORK/current/tests"

          gh run download "$MOBILE_RUN_ID" \
            --repo "$MOBILE_REPO" \
            --name mobile-jacoco-report \
            --dir "$REPORT_WORK/current/coverage"

      - name: Download Platform artifacts
        env: 
          GH_HOST: github.sfu.ca
          GH_ENTERPRISE_TOKEN: ${{ secrets.REPORT_ARTIFACT_TOKEN }}
          PLATFORM_REPOSITORY: ${{ github.repository }}
          REPORT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: | #  unlike mobile, the backend artifacts will be downloaded from whatever branch this workflow is ran from.
          set -eu
          PLATFORM_BRANCH="$REPORT_BRANCH"
          PLATFORM_WORKFLOW="main-cicd.yml"
          PLATFORM_REPO="github.sfu.ca/$PLATFORM_REPOSITORY"

          PLATFORM_RUN_ID=$(gh run list \
            --repo "$PLATFORM_REPO" \
            --workflow "$PLATFORM_WORKFLOW" \
            --branch "$PLATFORM_BRANCH" \
            --limit 100 \
            --json databaseId,status \
            --jq '[.[] | select(.status == "completed")][0].databaseId // empty')

          if [ -z "$PLATFORM_RUN_ID" ]; then
            echo "Error: No completed Platform workflow run found."
            exit 1
          fi

          echo "Using Platform run ID: $PLATFORM_RUN_ID"

          mkdir -p "$REPORT_WORK/backend/tests"
          mkdir -p "$REPORT_WORK/backend/coverage"
          mkdir -p "$REPORT_WORK/backend/html/unit-tests"
          mkdir -p "$REPORT_WORK/backend/html/coverage"

          gh run download "$PLATFORM_RUN_ID" \
            --repo "$PLATFORM_REPO" \
            --name backend-unit-test-xml \
            --dir "$REPORT_WORK/backend/tests"

          gh run download "$PLATFORM_RUN_ID" \
            --repo "$PLATFORM_REPO" \
            --name backend-coverage-report-xml \
            --dir "$REPORT_WORK/backend/coverage"

          gh run download "$PLATFORM_RUN_ID" \
            --repo "$PLATFORM_REPO" \
            --name backend-unit-test-html \
            --dir "$REPORT_WORK/backend/html/unit-tests"

          gh run download "$PLATFORM_RUN_ID" \
            --repo "$PLATFORM_REPO" \
            --name backend-coverage-report-html \
            --dir "$REPORT_WORK/backend/html/coverage"

          mkdir -p "$REPORT_WORK/frontend"

          gh run download "$PLATFORM_RUN_ID" \
            --repo "$PLATFORM_REPO" \
            --name frontend-test-reports \
            --dir "$REPORT_WORK/frontend"


      - name: Download previous artifacts
        env:
          GH_HOST: github.sfu.ca
          GH_ENTERPRISE_TOKEN: ${{ secrets.REPORT_ARTIFACT_TOKEN }}
          PREVIOUS_RUN_ID: ${{ github.event.inputs.previous_run_id }}
          PLATFORM_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu

          if [ -z "$PREVIOUS_RUN_ID" ]; then
            PREVIOUS_RUN_ID=$(gh run list \
              --repo "github.sfu.ca/$PLATFORM_REPOSITORY" \
              --workflow testing-dashboard.yml \
              --branch "main" \
              --limit 100 \
              --json databaseId,conclusion \
              --jq "[.[] | select(.conclusion == \"success\" and .databaseId != $GITHUB_RUN_ID)][0].databaseId // empty")
          fi

          if [ -z "$PREVIOUS_RUN_ID" ]; then
            echo "No previous successful dashboard found, skipping trend comparison."
            exit 0
          fi

          echo "Using previous run ID: $PREVIOUS_RUN_ID"

          gh run download "$PREVIOUS_RUN_ID" \
            --repo "github.sfu.ca/$PLATFORM_REPOSITORY" \
            --name testing-dashboard \
            --dir "$REPORT_WORK/previous"
  
      - name: Generate dashboard data
        run: |
          python testing-dashboard/report-generator.py \
            --mobile-artifacts "$REPORT_WORK/current" \
            --backend-artifacts "$REPORT_WORK/backend" \
            --frontend-artifacts "$REPORT_WORK/frontend" \
            --previous "$REPORT_WORK/previous/report-data.json"

          cp testing-dashboard/page/report-data.json "$REPORT_WORK/site/"
        working-directory: ${{ env.CUSTOM_WORKSPACE }}

      - name: Package mobile HTML reports
        run: |
          unit_report="$REPORT_WORK/current/tests/reports/tests/testDebugUnitTest"
          coverage_report="$REPORT_WORK/current/coverage/coverage/combined"
          
          test -f "$unit_report/index.html"
          test -f "$coverage_report/index.html"
          
          mkdir -p "$REPORT_WORK/site/reports/mobile"
          cp -a "$unit_report" "$REPORT_WORK/site/reports/mobile/unit-tests"
          cp -a "$coverage_report" "$REPORT_WORK/site/reports/mobile/jacoco"

      - name: Package backend HTML reports
        run: |
          set -eu
          unit_report="$REPORT_WORK/backend/html/unit-tests/unit-test-report.html"
          coverage_report="$REPORT_WORK/backend/html/coverage"

          test -f "$unit_report"
          test -f "$coverage_report/index.html"

          mkdir -p "$REPORT_WORK/site/reports/backend/unit-tests"
          mkdir -p "$REPORT_WORK/site/reports/backend/coverage"

          cp "$unit_report" "$REPORT_WORK/site/reports/backend/unit-tests/index.html"
          cp -a "$coverage_report/." "$REPORT_WORK/site/reports/backend/coverage/"

      - name: Package frontend HTML reports
        run: |
          set -eu
          unit_report="$REPORT_WORK/frontend/unit-tests"
          coverage_report="$REPORT_WORK/frontend/coverage"

          test -f "$unit_report/index.html"
          test -f "$coverage_report/index.html"

          mkdir -p "$REPORT_WORK/site/reports/frontend"

          cp -a "$unit_report" "$REPORT_WORK/site/reports/frontend/unit-tests"
          cp -a "$coverage_report" "$REPORT_WORK/site/reports/frontend/coverage"

      - name: Upload dashboard
        uses: actions/upload-artifact@v3
        with:
          name: testing-dashboard
          path: ${{ env.REPORT_WORK }}/site/
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ${{ env.REPORT_WORK }}/site/

  deploy-pages:
    needs: generate-dashboard
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, docker]
    container:
      image: node:20
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3
